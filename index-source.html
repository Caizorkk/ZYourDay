<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08080b" />
  <meta name="zork-version" content="2.0.0-profile-i18n" />
  <meta name="description" content="Zork Organiza — seu espaço para tarefas, ideias, notas, planilhas, datas e planejamento financeiro." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>Zork Organiza — seu espaço, seu ritmo.</title>
</head>
<body data-theme="dark" data-style="modern">
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark" id="brand-mark"><span>✦</span></div><div><strong>Zork <span>Organiza</span></strong><small>Seu espaço pessoal</small></div></div>
      <div class="nav-overline">ÁREA DE TRABALHO</div>
      <nav id="nav" aria-label="Navegação principal"></nav>
      <div class="side-bottom">
        <button class="account-mini" id="account-mini" type="button"><div class="avatar">✦</div><span><strong>Visitante</strong><small>Conta e sincronização</small></span><span class="mini-arrow">›</span></button>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><button class="icon-btn mobile-menu" id="menu-button" aria-label="Abrir menu" type="button">☰</button><div class="breadcrumbs" id="breadcrumbs">Início <span>/</span> Visão geral</div><div class="topbar-right"><div class="top-pill" aria-live="off"><time id="today-tag"></time><span class="top-clock"><span id="clock-tag">--:--</span><span class="timezone" id="timezone-tag"></span></span></div><button class="top-avatar" id="account-top" aria-label="Minha conta" type="button">✦</button></div></header>
      <main id="main" tabindex="-1"></main>
    </div>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
